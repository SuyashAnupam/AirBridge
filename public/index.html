<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple WebRTC Chat (Same Wi‑Fi)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    video { width: 45%; margin: 5px; background: #000; }
    #status { margin-top: 10px; color: #555; }
    #chat { margin-top: 15px; }
    #messages { border: 1px solid #ccc; height: 150px; overflow-y: auto; padding: 5px; }
    #inputBox { width: 80%; }
    #sendBtn { width: 18%; }
  </style>
</head>
<body>
  <h2>Simple WebRTC Chat (Same Wi‑Fi)</h2>
  <video id="localVideo" autoplay muted></video>
  <video id="remoteVideo" autoplay></video>
  <div id="status">Initializing...</div>

  <div id="chat">
    <div id="messages"></div>
    <input type="text" id="inputBox" placeholder="Type a message..." />
    <button id="sendBtn">Send</button>
  </div>

  <!-- Socket.io client library (served by the server) -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const configuration = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };
    const pc = new RTCPeerConnection(configuration);
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const statusDiv = document.getElementById('status');
    const messagesDiv = document.getElementById('messages');
    const inputBox = document.getElementById('inputBox');
    const sendBtn = document.getElementById('sendBtn');

    let dataChannel = null;
    let isInitiator = false; // true for the peer that creates the first offer

    // ---------- Media ----------
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .then(stream => {
        statusDiv.textContent = '📹 Local media acquired';
        localVideo.srcObject = stream;
        stream.getTracks().forEach(track => pc.addTrack(track, stream));
      })
      .catch(err => {
        statusDiv.textContent = '❌ Error accessing media devices';
        console.error(err);
      });

    // ---------- Remote Track ----------
    pc.ontrack = event => {
      remoteVideo.srcObject = event.streams[0];
    };

    // ---------- ICE Candidates ----------
    pc.onicecandidate = event => {
      if (event.candidate) {
        socket.emit('signal', {
          to: remotePeerId,
          type: 'candidate',
          payload: event.candidate
        });
      }
    };

    // ---------- Data Channel ----------
    pc.ondatachannel = event => {
      dataChannel = event.channel;
      setupDataChannel();
    };

    function createDataChannel() {
      dataChannel = pc.createDataChannel('chat');
      setupDataChannel();
    }

    function setupDataChannel() {
      dataChannel.onopen = () => {
        console.log('💬 Data channel opened');
        appendMessage('--- Data channel opened ---');
      };
      dataChannel.onmessage = e => {
        appendMessage(`Peer: ${e.data}`);
      };
      dataChannel.onclose = () => {
        console.log('💬 Data channel closed');
        appendMessage('--- Data channel closed ---');
      };
    }

    function appendMessage(msg) {
      const p = document.createElement('p');
      p.textContent = msg;
      messagesDiv.appendChild(p);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // ---------- Signalling ----------
    let remotePeerId = null; // will hold the id of the peer we are talking to

    socket.on('ready', data => {
      // data.peers is an array of peer ids that are already online
      if (data.peers.length > 0) {
        // Connect to the first peer in the list
        remotePeerId = data.peers[0];
        isInitiator = true;
        createDataChannel(); // initiator creates the data channel
        startOffer();
      } else {
        // No other peers yet – wait for someone to join
        statusDiv.textContent = '⏳ Waiting for a peer...';
      }
    });

    socket.on('signal', async data => {
      if (data.from === socket.id) return; // ignore own messages
      remotePeerId = data.from; // remember who sent this

      switch (data.type) {
        case 'offer':
          await pc.setRemoteDescription(new RTCSessionDescription(data.payload));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          socket.emit('signal', {
            to: remotePeerId,
            type: 'answer',
            payload: answer
          });
          break;

        case 'answer':
          await pc.setRemoteDescription(new RTCSessionDescription(data.payload));
          break;

        case 'candidate':
          try {
            await pc.addIceCandidate(new RTCIceCandidate(data.payload));
          } catch (e) {
            console.error('Error adding received ICE candidate', e);
          }
          break;
      }
    });

    socket.on('peer-left', data => {
      if (data.id === remotePeerId) {
        statusDiv.textContent = '⚠️ Peer disconnected';
        remotePeerId = null;
        // Close existing connection gracefully
        if (pc) pc.close();
      }
    });

    async function startOffer() {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit('signal', {
        to: remotePeerId,
        type: 'offer',
        payload: offer
      });
    }

    // ---------- Chat UI ----------
    sendBtn.addEventListener('click', sendMessage);
    inputBox.addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      const msg = inputBox.value.trim();
      if (!msg || !dataChannel || dataChannel.readyState !== 'open') return;
      dataChannel.send(msg);
      appendMessage(`You: ${msg}`);
      inputBox.value = '';
    }
  </script>
</body>
</html>
